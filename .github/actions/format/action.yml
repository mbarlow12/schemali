name: 'Format with Ruff'
description: 'Format code using ruff formatter'
inputs:
  paths:
    description: 'Paths to format (space-separated)'
    required: false
    default: 'schemali tests'
  check-only:
    description: 'Only check formatting without making changes'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run ruff format
      shell: bash
      run: |
        if [ "${{ inputs.check-only }}" = "true" ]; then
          echo "Checking code formatting..."
          ruff format --check ${{ inputs.paths }}
        else
          echo "Formatting code..."
          ruff format ${{ inputs.paths }}
        fi

    - name: Show formatting status
      shell: bash
      run: |
        if [ "${{ inputs.check-only }}" = "true" ]; then
          echo "Format check completed"
        else
          echo "Code formatting completed"
        fi
