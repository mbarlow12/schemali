name: 'Lint with Ruff'
description: 'Run ruff linter with optional auto-fix'
inputs:
  auto-fix:
    description: 'Automatically fix linting issues'
    required: false
    default: 'false'
  paths:
    description: 'Paths to lint (space-separated)'
    required: false
    default: 'schemali tests'
  fail-on-error:
    description: 'Fail the action if linting errors are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run ruff check
      shell: bash
      run: |
        if [ "${{ inputs.auto-fix }}" = "true" ]; then
          echo "Running ruff check with auto-fix..."
          uv run ruff check --fix ${{ inputs.paths }}
        else
          echo "Running ruff check..."
          if [ "${{ inputs.fail-on-error }}" = "true" ]; then
            uv run ruff check ${{ inputs.paths }}
          else
            uv run ruff check ${{ inputs.paths }} || true
          fi
        fi

    - name: Show ruff version
      shell: bash
      run: uv run ruff --version
