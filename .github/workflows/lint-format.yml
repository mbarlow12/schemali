name: Lint and Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project with uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: '3.11'
          install-dev: 'true'

      - name: Run ruff linting
        uses: ./.github/actions/lint
        with:
          auto-fix: 'false'
          paths: 'schemali tests'
          fail-on-error: 'true'

  format:
    name: Check Code Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project with uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: '3.11'
          install-dev: 'true'

      - name: Check code formatting
        uses: ./.github/actions/format
        with:
          paths: 'schemali tests'
          check-only: 'true'

  auto-fix-on-merge:
    name: Auto-fix Lint and Format Issues
    runs-on: ubuntu-latest
    needs: [lint, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (failure() || success())
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup project with uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: '3.11'
          install-dev: 'true'

      - name: Auto-fix linting issues
        uses: ./.github/actions/lint
        with:
          auto-fix: 'true'
          paths: 'schemali tests'
          fail-on-error: 'false'

      - name: Auto-format code
        uses: ./.github/actions/format
        with:
          paths: 'schemali tests'
          check-only: 'false'

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-fix linting and formatting issues [skip ci]"
            git push
          fi
