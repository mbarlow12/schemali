[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemali"
version = "0.1.0"
description = "A CLI tool for generating JSON schemas from Pydantic models"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "schemali contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
schemali = "schemali.cli:main"

[project.urls]
Homepage = "https://github.com/mbarlow12/schemali"
Repository = "https://github.com/mbarlow12/schemali"

[tool.setuptools.packages.find]
where = ["."]
include = ["schemali*"]
